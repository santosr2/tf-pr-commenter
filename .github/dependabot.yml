version: 2

updates:
  # Production deps are bundled into the committed dist/, which CI verifies with
  # `git diff --exit-code -- dist`. Dependabot never runs the build, so a merged
  # bump here needs `mise run package` first. Grouping minor+patch keeps that to
  # one rebuild instead of one per dependency; majors arrive alone unless a
  # group below opts them in.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      # @vitest/coverage-v8 pins its peer dependency to the exact matching
      # vitest version, so split major PRs can never pass `npm ci`. Majors for
      # the pair must land in one PR.
      vitest-major:
        patterns: ['vitest', '@vitest/*']
        update-types: [major]
      runtime-deps:
        dependency-type: production
        update-types: [minor, patch]
      dev-deps:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Typings track the Node major that action.yml's `runs.using` declares.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]

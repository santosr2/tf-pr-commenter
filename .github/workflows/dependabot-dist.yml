name: Dependabot dist

# Dependabot edits the manifests but never runs the build, so a dependency bump
# arrives with a dist/ bundle compiled from the previous lockfile and CI's
# `git diff --exit-code -- dist` rejects it. Rebuilding here is what verifies
# the bundle: the commit this pushes is the output of a clean lockfile install.
on:
  pull_request:

permissions:
  contents: write

jobs:
  rebuild-dist:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # pull_request checks out a detached merge ref, which cannot be pushed.
          ref: ${{ github.head_ref }}
      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: mise run install
      - run: mise run package
      - name: Commit rebuilt bundle
        run: |
          # Staged, because a plain diff ignores files ncc newly emits.
          git add -A dist
          if git diff --cached --quiet -- dist; then
            echo 'dist is already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(deps): rebuild dist' -- dist
          git push

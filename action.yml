name: 'TF PR Commenter'
description: 'One aggregated, budget-aware PR comment for many Terraform/Terragrunt plans.'
inputs:
  plan-root:
    description: 'Directory of downloaded plan-*/ artifact subdirs (each with tfplan.json + plan-meta.json). Surfaces FAILED stacks that the plan-files glob misses. Takes precedence over plan-files.'
    required: false
  plan-files:
    description: 'Newline-separated list OR glob of terraform show -json files. Used when plan-root is unset.'
    required: false
  plan-text-files:
    description: 'Optional newline list/glob of raw plan text files, paired to plan-files by directory.'
    required: false
  github-token:
    description: 'Token with pull-requests: write (and actions: read to enable warn-on-failed-jobs).'
    default: ${{ github.token }}
  warn-on-failed-jobs:
    description: 'Prepend a banner naming jobs in this run that failed or were cancelled, so the comment never reads as success while a job actually failed (e.g. a job that produced no artifact). Needs actions: read on github-token; silently skipped if not granted.'
    default: 'true'
  header:
    description: 'Comment title.'
    default: '🏗️ Terraform Plan'
  marker:
    description: 'Hidden HTML marker for upsert.'
    default: '<!-- tf-pr-commenter -->'
  char-budget:
    description: 'Max comment chars. GitHub hard limit is 65536.'
    default: '65000'
  template:
    description: 'Path to a .eta template or inline template. Defaults to the bundled template.'
    required: false
  tool:
    description: 'auto | terraform | terragrunt. Controls plan-text prefix stripping.'
    default: 'auto'
  show-outputs:
    description: 'Surface Terraform''s "Changes to Outputs" section as a "Δ N outputs" badge and an "Output changes" block. Off by default: output-only diffs are the lowest-signal channel and often just sensitive values.'
    default: 'false'
  job-link-pattern:
    description: 'Case-insensitive regex matched against this run''s job names; a stack path found in a matching job name links that stack to the job. Empty by default: a job URL costs ~85 chars, so linking every row spends character budget that plan detail could use. Set to "plan" to link a matrix plan job while skipping a policy or apply job for the same stack. Needs actions: read; silently plain if not granted.'
    default: ''
  show-unchanged:
    description: 'Keep a table row for every stack with no planned changes and no drift. Off by default: those rows carry no signal and spend character budget that plan detail could use. The count is reported in a footer either way.'
    default: 'false'
outputs:
  comment-id:
    description: 'The created or updated comment id.'
  body:
    description: 'The rendered comment body.'
runs:
  using: 'node24'
  main: 'dist/index.js'
